[project]
name = "stocksense-ml"
version = "0.1.0"
requires-python = ">=3.12"

[tool.setuptools.package-data]
stocksense_ml = ["festivals.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE", "NPY", "PD002"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
