name: Nightly forecast

# Trains the forecasting model per shop and writes the next 14 days into Supabase.
# Needs the repository secret SUPABASE_SECRET_KEY (Supabase → Project Settings → API Keys → secret key).
on:
  schedule:
    - cron: "41 20 * * *" # 02:11 IST every day (GitHub may start scheduled runs a little late)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Forecast but write nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      SUPABASE_URL: https://jhiaiqhnidyqgagchzbp.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install
        run: pip install -r ml/requirements.txt
      - name: Check secret
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::Add the SUPABASE_SECRET_KEY repository secret (see HANDOFF.md)."
            exit 1
          fi
      - name: Forecast all shops
        working-directory: ml
        run: python -m stocksense_ml nightly --engine lightgbm ${{ inputs.dry_run && '--dry-run' || '' }} 2>&1 | tee nightly.log
      - name: Summary
        if: ${{ !cancelled() }}
        working-directory: ml
        run: |
          [ -f nightly.log ] || exit 0
          { echo '### Nightly forecast'; echo '```'; grep -E "shop |done:|ERROR|Error" nightly.log || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=nightly::$(grep -E 'done:|ERROR|Error' nightly.log | tail -5 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"
