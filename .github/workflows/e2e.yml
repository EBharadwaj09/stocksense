name: End-to-end tests

# Real browsers against the live site: sign-up checks, demo, owner (create shop -> import -> stock ->
# sale -> count -> forecast -> reorder), staff (invite -> join -> limits) and sign-out.
# Also: axe-core accessibility audit and phone-width layout check on every page (test_accessibility.py).
# Runs after every successful production deploy (Vercel's commit status on main) and on demand.
# Uses throwaway users flagged app_metadata.e2e, deleted with their shop at the end (see e2e/README.md).
on:
  status:
  workflow_dispatch:
    inputs:
      url:
        description: "Site to test"
        default: "https://stocksense-phi-tan.vercel.app"

permissions:
  contents: read

concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  e2e:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.context == 'Vercel' && github.event.state == 'success' &&
       contains(github.event.branches.*.name, 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      E2E_BASE_URL: ${{ inputs.url || 'https://stocksense-phi-tan.vercel.app' }}
      SUPABASE_URL: https://jhiaiqhnidyqgagchzbp.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ml/requirements.txt
            e2e/requirements.txt
      - name: Install
        run: |
          pip install -r ml/requirements.txt -r e2e/requirements.txt
          python -m playwright install --with-deps chromium
          npm install --no-save --no-package-lock --prefix e2e axe-core@4.10.3
      - name: Wait for the site
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$E2E_BASE_URL/login") && [ "$code" = 200 ] && exit 0
            sleep 10
          done
          echo "::error::$E2E_BASE_URL/login did not return 200"; exit 1
      - name: Run
        working-directory: e2e
        run: python -m pytest 2>&1 | tee e2e.log
      - name: Results as annotations
        if: ${{ !cancelled() }}
        working-directory: e2e
        run: |
          [ -f e2e.log ] || exit 0
          level=notice; grep -qE "(FAILED|ERROR)" e2e.log && level=error
          echo "::$level title=e2e::$(grep -E '\[a11y\]|PASSED|FAILED|ERROR|Error|assert|expect|passed|failed' e2e.log | tail -n 90 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"
